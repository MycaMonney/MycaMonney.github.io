<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booster Pokémon</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        #card-container {
            margin-top: 20px;
        }
        img {
            width: 300px;
            height: 300px;
            object-fit: contain;
            margin: 5px;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Ouvre ton booster Pokémon !</h1>
    <div id="card-container">
        <img id="current-card" src="img/Booster.png" alt="Booster">
    </div>
    <button id="open-booster">Ouvrir</button>
    <button id="next-card" style="display: none;">Suivant</button>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.3.2"></script> <!-- Ajout de confettis -->
    
    <script>
        const images = [
            "asterion.png", "Flamino.png", "Floraptor.png", "MistralusFullart.png", "Nepturtle.png",
            "Sylvowis.png", "Torshield.png", "Turtisplash.png", "Tylhibou.png", "Tim.png",
            "TimFullart.png", "Aidan.png", "AidanFullart.png", "Myca.png", "MycaFullart.png"
        ];
        
        let drawnCards = [];
        let normalCards = [];
        let fullartCards = [];
        let currentIndex = 0;
        const maxDraws = 5;
        
        const cardContainer = document.getElementById("card-container");
        const openBoosterBtn = document.getElementById("open-booster");
        const nextCardBtn = document.getElementById("next-card");
        
        openBoosterBtn.addEventListener("click", function() {
            drawnCards = [];
            normalCards = [];
            fullartCards = [];
            currentIndex = 0;
            cardContainer.innerHTML = "";
            drawCards();
            openBoosterBtn.style.display = "none";
            nextCardBtn.style.display = "inline-block";
            displayCurrentCard();
        });

        nextCardBtn.addEventListener("click", function() {
            currentIndex++;
            if (currentIndex < drawnCards.length) {
                displayCurrentCard();
            } else {
                showRecap(); // Afficher le récapitulatif final
            }
        });

        function drawCards() {
            while (normalCards.length + fullartCards.length < maxDraws) {
                const randomIndex = Math.floor(Math.random() * images.length);
                const cardImage = images[randomIndex];

                if (cardImage.includes("Fullart")) {
                    if (!fullartCards.includes(cardImage)) fullartCards.push(cardImage);
                } else {
                    if (!normalCards.includes(cardImage)) normalCards.push(cardImage);
                }
            }

            // On fusionne : d'abord les normales, puis les Fullart
            drawnCards = [...normalCards, ...fullartCards];
        }

        function displayCurrentCard() {
            cardContainer.innerHTML = "";
            const currentCard = drawnCards[currentIndex];
            const imgElement = document.createElement("img");
            imgElement.src = "img/" + currentCard;
            cardContainer.appendChild(imgElement);

            // Si c'est une Fullart, animation de confettis
            if (currentCard.includes("Fullart")) {
                launchConfetti();
            }
        }

        function showRecap() {
            cardContainer.innerHTML = "<h2>Récapitulatif du Booster :</h2>";
            drawnCards.forEach(image => {
                const imgElement = document.createElement("img");
                imgElement.src = "img/" + image;
                cardContainer.appendChild(imgElement);
            });

            nextCardBtn.innerText = "Réouvrir";
            nextCardBtn.addEventListener("click", restartBooster, { once: true });
        }

        function restartBooster() {
            drawnCards = [];
            normalCards = [];
            fullartCards = [];
            currentIndex = 0;
            cardContainer.innerHTML = "<img id='current-card' src='img/Booster.png' alt='Booster'>";
            openBoosterBtn.style.display = "inline-block";
            nextCardBtn.style.display = "none";
            nextCardBtn.innerText = "Suivant";
        }

        function sendTopCard(){

        }
        function launchConfetti() {
            confetti({
                particleCount: 1000,
                spread: 1000,
                origin: { y: 0.2 }
            });
        }
    </script>
</body>
</html>
